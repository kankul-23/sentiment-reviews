[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-reviews"
version = "0.1.0"
description = "Классификация рейтинга по русскоязычным отзывам (Geo Reviews 2023)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "tqdm",
    "datasets",
    "transformers",
    "datasketch",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ipykernel",
    "jupyter",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
