[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-reviews"
version = "0.1.0"
description = "Классификация рейтинга по русскоязычным отзывам (Geo Reviews 2023)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# torch сюда не входит: ставится отдельно под ваше железо (CPU или CUDA), см. README.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",            # calibration.py (подбор температуры)
    "joblib",           # baseline.py (сохранение модели)
    "pyyaml",
    "matplotlib",
    "seaborn",
    "tqdm",
    "datasets",
    "transformers>=4.40",
    "datasketch",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",    # схемы сервиса написаны под pydantic v2
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ipykernel",
    "jupyter",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
