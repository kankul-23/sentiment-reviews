# Бейзлайн TF-IDF + LogisticRegression (Фаза 3)
seed: 42

tfidf:
  word:
    analyzer: word
    ngram_range: [1, 2]
    min_df: 3
    sublinear_tf: true
    max_features: 300000
  char:
    analyzer: char_wb
    ngram_range: [2, 5]
    min_df: 5
    sublinear_tf: true
    max_features: 500000

model:
  C: 1.0
  max_iter: 300
  solver: lbfgs

# Шаг 1: сравнение конфигураций на val (один размер train)
comparison:
  size: 50000
  variants: [word, char, "word+char"]
  class_weight: ["none", "balanced"]

# Шаг 2: learning curve. Правило выбора размера задано ДО запуска:
# берём наименьший размер, после которого следующий шаг даёт прирост macro-F1
# меньше max(std между повторами, min_gain).
learning_curve:
  sizes: [10000, 25000, 50000, 100000]
  n_repeats: 3
  min_gain: 0.005

# Заполняется ВРУЧНУЮ после сравнения (variant, class_weight) и кривой (train_size).
# class_weight: "none" или "balanced". train_size: число или "full".
selected:
  variant: "word+char"
  class_weight: balanced
  train_size: 100000
