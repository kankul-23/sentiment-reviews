# Бейзлайн TF-IDF + LogisticRegression (Фаза 3)
seed: 42
tfidf:
  word:
    ngram_range: [1, 2]
    min_df: 3
  char:
    analyzer: char_wb
    ngram_range: [2, 5]
    min_df: 5
model:
  C: 1.0
  max_iter: 1000
  class_weight: null
learning_curve:
  sizes: [10000, 25000, 50000, 100000]
  n_repeats: 3
